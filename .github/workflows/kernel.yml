name: Kernel Module CI

on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - '.github/workflows/kernel.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - '.github/workflows/kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel-module:
    name: Build astra_root.ko (${{ matrix.gki }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gki: android12-5.10
            branch: android12-5.10
          - gki: android13-5.15
            branch: android13-5.15
          - gki: android14-6.1
            branch: android14-6.1
          - gki: android15-6.6
            branch: android15-6.6

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc flex bison libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu git cpio

      - name: Cache kernel source
        uses: actions/cache@v4
        id: kernel-cache
        with:
          path: ~/kernel-src
          key: gki-${{ matrix.gki }}-v1

      - name: Clone Android Common Kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/kernel/common \
            -b ${{ matrix.branch }} \
            ~/kernel-src

      - name: Prepare kernel build tree
        run: |
          cd ~/kernel-src
          # GKI default config for arm64
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          # Set up the build infrastructure for out-of-tree modules.
          # modules_prepare generates scripts, Kbuild, and compiled helpers
          # needed by the kbuild system when building external modules.
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) modules_prepare

      - name: Build astra_root.ko
        run: |
          cd kernel
          # KBUILD_MODPOST_WARN=1 turns undefined-symbol errors into warnings.
          # This is normal for out-of-tree modules built without a full kernel
          # build (no Module.symvers). The symbols (misc_register, commit_creds,
          # etc.) are exported kernel symbols resolved at insmod time.
          make -C ~/kernel-src \
            M=$(pwd) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_MODPOST_WARN=1 \
            modules

      - name: Verify module
        run: |
          echo "=== Module info ==="
          file kernel/astra_root.ko
          echo ""
          echo "=== Module size ==="
          ls -lh kernel/astra_root.ko
          echo ""
          echo "=== modinfo (if available) ==="
          sudo apt-get install -y kmod 2>/dev/null || true
          modinfo kernel/astra_root.ko || true

      - name: Upload astra_root.ko
        uses: actions/upload-artifact@v4
        with:
          name: astra_root-${{ matrix.gki }}
          path: kernel/astra_root.ko
          if-no-files-found: error
          retention-days: 30
