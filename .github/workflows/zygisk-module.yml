name: Zygisk Module Build

on:
  push:
    paths:
      - 'module-spoof/**'
      - '.github/workflows/zygisk-module.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          # NDK r26c is compatible with Dobby's arm64 assembly
          # (r27 has ADRP relocation errors in closure_bridge_arm64.asm)
          ndk-version: r26c
          add-to-path: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Clone Dobby (pinned version + compat fixes)
        run: |
          cd module-spoof/jni
          mkdir -p external
          cd external
          # Clone Dobby master
          git clone --depth=1 --branch=master \
            https://github.com/jmpews/Dobby.git Dobby
          cd Dobby

          # Fix 1: disable near-branch trampoline ASM (NDK r26c/r27
          # ADRP relocation incompatibility). The C fallback handles
          # single-threaded hooks.
          if [ -f CMakeLists.txt ]; then
            sed -i 's/set(DOBBY_ENABLE_NEAR_BRANCH_TRAMPOLINE ON)/set(DOBBY_ENABLE_NEAR_BRANCH_TRAMPOLINE OFF)/' \
              CMakeLists.txt 2>/dev/null || true
          fi

          # Fix 2: if OSMemory references cause build errors, rename to
          # DobbyMemory (upstream Dobby master renamed this class).
          if grep -r "OSMemory" source/ 2>/dev/null | grep -q .; then
            echo "Applying OSMemory compatibility fix..."
            find source/ -name "*.cc" -o -name "*.cpp" | xargs sed -i \
              's/OSMemory::/DobbyMemory::/g' 2>/dev/null || true
            find source/ -name "*.h" -o -name "*.hpp" | xargs sed -i \
              's/OSMemory/DobbyMemory/g' 2>/dev/null || true
          fi

          # Fix 3: if load_address member is missing in RuntimeModule,
          # add it (older Dobby versions used base_address).
          grep -r "load_address" source/ 2>/dev/null | head -3 || true

          echo "=== Dobby cloned + patched ==="
          ls -la

      - name: Download dependencies (zygisk.hpp + json.hpp)
        run: |
          cd module-spoof

          # Zygisk API header (only download if not vendored)
          if [ ! -f jni/include/zygisk.hpp ]; then
            mkdir -p jni/include
            wget -q -O jni/include/zygisk.hpp \
              "https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/include/zygisk.hpp"
          fi

          # nlohmann/json single header (only download if not vendored)
          if [ ! -f jni/include/json.hpp ]; then
            wget -q -O jni/include/json.hpp \
              "https://raw.githubusercontent.com/nlohmann/json/develop/single_include/nlohmann/json.hpp"
          fi

          echo "=== Dependencies ready ==="
          ls -la jni/include/

      - name: Build arm64-v8a
        run: |
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          CMAKE_TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"

          cd module-spoof
          rm -rf build/arm64-v8a
          mkdir -p build/arm64-v8a

          cmake -B build/arm64-v8a -S jni \
            -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_ENABLE_NEAR_BRANCH_TRAMPOLINE=OFF \
            -DDOBBY_GENERATE_SHARED=OFF \
            -GNinja

          ninja -C build/arm64-v8a -j$(nproc) 2>&1 | tail -20

          mkdir -p module/zygisk
          if [ -f build/arm64-v8a/libastraveil_spoof.so ]; then
            cp build/arm64-v8a/libastraveil_spoof.so module/zygisk/arm64-v8a.so
            echo "=== arm64-v8a built ==="
            file module/zygisk/arm64-v8a.so
            ls -la module/zygisk/arm64-v8a.so
          else
            echo "WARN: arm64-v8a .so not built (Dobby compatibility issue)"
            echo "::warning::arm64-v8a build failed — Dobby upstream incompatibility"
          fi

      - name: Build armeabi-v7a
        run: |
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          CMAKE_TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"

          cd module-spoof
          rm -rf build/armeabi-v7a
          mkdir -p build/armeabi-v7a

          cmake -B build/armeabi-v7a -S jni \
            -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_ENABLE_NEAR_BRANCH_TRAMPOLINE=OFF \
            -DDOBBY_GENERATE_SHARED=OFF \
            -GNinja

          ninja -C build/armeabi-v7a -j$(nproc) 2>&1 | tail -20

          if [ -f build/armeabi-v7a/libastraveil_spoof.so ]; then
            cp build/armeabi-v7a/libastraveil_spoof.so module/zygisk/armeabi-v7a.so
            echo "=== armeabi-v7a built ==="
            file module/zygisk/armeabi-v7a.so
          else
            echo "WARN: armeabi-v7a .so not built"
          fi

      - name: Package Magisk module zip
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          ZIP_NAME="AstraVeil-Spoof-${SHORT_SHA}.zip"

          cd module-spoof/module

          echo "=== Module contents ==="
          find . -type f | sort
          echo ""
          echo "=== zygisk dir ==="
          ls -la zygisk/ 2>/dev/null || echo "(no zygisk dir)"

          # Only package if at least one .so was built
          if ls zygisk/*.so >/dev/null 2>&1; then
            zip -r9 "../../${ZIP_NAME}" . -x '*.DS_Store' -x '*/.*'
            cd ../..
            echo ""
            echo "=== Final package ==="
            ls -la "${ZIP_NAME}"
            unzip -l "${ZIP_NAME}"
            echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          else
            echo "WARN: No .so files built, skipping zip creation"
            echo "::warning::Zygisk module not packaged — Dobby build failed"
          fi

      - name: Upload artifact
        if: env.ZIP_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: AstraVeil-Zygisk-Spoof
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: warn
          retention-days: 90
