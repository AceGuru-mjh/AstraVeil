name: AstraVeil Daemon Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Configure daemon
        run: cmake -S daemon -B build-daemon -DCMAKE_CXX_STANDARD=20
      - name: Build daemon
        run: cmake --build build-daemon -j

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Build rust crate
        run: cargo build --manifest-path rust/Cargo.toml
      - name: Test rust crate
        run: cargo test --manifest-path rust/Cargo.toml
