name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        env:
          ASTRAVEIL_KEYSTORE_PASSWORD: ${{ secrets.ASTRAVEIL_KEYSTORE_PASSWORD }}
          ASTRAVEIL_KEY_ALIAS: ${{ secrets.ASTRAVEIL_KEY_ALIAS }}
          ASTRAVEIL_KEY_PASSWORD: ${{ secrets.ASTRAVEIL_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Generate SHA-256 checksum
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then echo "No APK found"; exit 1; fi
          echo "APK found: $APK_PATH"
          sha256sum "$APK_PATH" > "$APK_PATH.sha256"
          cat "$APK_PATH.sha256"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: astraveil-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AstraVeil ${{ github.ref_name }}
          body_path: release/release_notes.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          prerelease: false
