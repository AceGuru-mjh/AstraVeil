name: Native CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  daemon-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Configure daemon
        run: cmake -S daemon -B build-daemon -DCMAKE_CXX_STANDARD=20
      - name: Build daemon + tests
        run: cmake --build build-daemon -j
      - name: Run daemon tests
        run: ctest --test-dir build-daemon --output-on-failure
      - name: Verify Rust policy linked (fail-closed guarantee)
        run: |
          ASTRAD=$(find build-daemon -name "astrad" -type f | head -1)
          if [ -z "$ASTRAD" ]; then
            echo "FATAL: astrad binary not found"; exit 1
          fi
          echo "Checking $ASTRAD..."
          if nm "$ASTRAD" | grep -qE " [wW] policy_is_available"; then
            echo "FATAL: policy_is_available is WEAK — Rust not linked, would fail open"
            exit 1
          fi
          if ! nm "$ASTRAD" | grep -q "T policy_is_available"; then
            echo "FATAL: policy_is_available missing from binary"
            exit 1
          fi
          echo "OK: Rust policy linked (policy_is_available is a strong symbol), fail-closed enforced"
