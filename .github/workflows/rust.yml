name: Rust Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --manifest-path rust/Cargo.toml

      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml
