// AstraVeil — Daemon ↔ App IPC 协议
// 定义 astrad (C++ daemon) 与 Android 应用层之间的通信消息。
// 传输层: Unix Domain Socket (/dev/socket/astrad)
// 帧格式: [4-byte length (big-endian)] [payload (protobuf)]

syntax = "proto3";

package astra.ipc.v1;

option java_package = "com.astraveil.proto.ipc.v1";
option java_multiple_files = true;
option java_outer_classname = "IpcProto";

import "astra/common/v1/types.proto";

// ─────────────────────────────────────────────────────────────────────────────
// IPC 消息信封
// ─────────────────────────────────────────────────────────────────────────────

// 所有 IPC 消息的顶层信封
message IpcEnvelope {
  // 消息唯一 ID（用于请求-响应配对）
  string message_id = 1;

  // 消息类型
  MessageType type = 2;

  // 协议版本（用于兼容性检查）
  int32 protocol_version = 3;

  // 发送方标识
  string sender = 4;

  // 时间戳
  astra.common.v1.AstraTimestamp timestamp = 5;

  // 载荷（根据 type 解析对应消息）
  oneof payload {
    HandshakeRequest handshake_request = 10;
    HandshakeResponse handshake_response = 11;
    PolicyQuery policy_query = 12;
    PolicyResponse policy_response = 13;
    ModuleCommand module_command = 14;
    ModuleEvent module_event = 15;
    Heartbeat heartbeat = 16;
    HeartbeatAck heartbeat_ack = 17;
    ShutdownRequest shutdown_request = 18;
    ShutdownResponse shutdown_response = 19;
    StatusReport status_report = 20;
  }
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_HANDSHAKE_REQUEST = 1;
  MESSAGE_TYPE_HANDSHAKE_RESPONSE = 2;
  MESSAGE_TYPE_POLICY_QUERY = 3;
  MESSAGE_TYPE_POLICY_RESPONSE = 4;
  MESSAGE_TYPE_MODULE_COMMAND = 5;
  MESSAGE_TYPE_MODULE_EVENT = 6;
  MESSAGE_TYPE_HEARTBEAT = 7;
  MESSAGE_TYPE_HEARTBEAT_ACK = 8;
  MESSAGE_TYPE_SHUTDOWN_REQUEST = 9;
  MESSAGE_TYPE_SHUTDOWN_RESPONSE = 10;
  MESSAGE_TYPE_STATUS_REPORT = 11;
}

// ─────────────────────────────────────────────────────────────────────────────
// 握手
// ─────────────────────────────────────────────────────────────────────────────

message HandshakeRequest {
  string client_version = 1;      // App 版本
  int32 min_protocol_version = 2; // 最低支持协议版本
  int32 max_protocol_version = 3; // 最高支持协议版本
  string capabilities = 4;        // 逗号分隔的能力列表
}

message HandshakeResponse {
  astra.common.v1.StatusCode status = 1;
  int32 negotiated_version = 2;   // 协商后的协议版本
  string daemon_version = 3;
  repeated string supported_capabilities = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// 策略查询
// ─────────────────────────────────────────────────────────────────────────────

message PolicyQuery {
  // 查询类型
  PolicyQueryType query_type = 1;

  // 目标进程
  astra.common.v1.ProcessIdentity target = 2;

  // 请求的操作
  string action = 3;              // e.g. "file.read", "network.connect", "ipc.bind"

  // 目标资源
  string resource = 4;            // e.g. "/data/data/com.example/files/config.json"

  // 附加上下文
  map<string, string> context = 5;
}

enum PolicyQueryType {
  POLICY_QUERY_TYPE_UNSPECIFIED = 0;
  POLICY_QUERY_TYPE_ALLOW_DENY = 1;     // 简单允许/拒绝
  POLICY_QUERY_TYPE_AUDIT = 2;          // 审计（记录但不阻止）
  POLICY_QUERY_TYPE_RATE_LIMIT = 3;     // 速率限制检查
  POLICY_QUERY_TYPE_BATCH = 4;          // 批量查询
}

message PolicyResponse {
  astra.common.v1.StatusCode status = 1;

  // 决策
  PolicyDecision decision = 2;

  // 决策原因（人类可读）
  string reason = 3;

  // 匹配的规则 ID
  string matched_rule_id = 4;

  // 速率限制信息（当 query_type == RATE_LIMIT 时）
  RateLimitInfo rate_limit = 5;

  // 批量结果（当 query_type == BATCH 时）
  repeated PolicyResponse batch_results = 6;
}

enum PolicyDecision {
  POLICY_DECISION_UNSPECIFIED = 0;
  POLICY_DECISION_ALLOW = 1;
  POLICY_DECISION_DENY = 2;
  POLICY_DECISION_AUDIT = 3;        // 允许但记录
  POLICY_DECISION_CHALLENGE = 4;    // 需要用户确认
  POLICY_DECISION_RATE_LIMITED = 5; // 被速率限制
}

message RateLimitInfo {
  int32 remaining = 1;
  int32 limit = 2;
  int64 reset_at_seconds = 3;     // Unix timestamp
}

// ─────────────────────────────────────────────────────────────────────────────
// 模块命令
// ─────────────────────────────────────────────────────────────────────────────

message ModuleCommand {
  string module_id = 1;
  ModuleCommandType command = 2;
  bytes parameters = 3;           // 模块特定参数（由模块自行解析）
  int64 timeout_ms = 4;           // 超时（0 = 无超时）
}

enum ModuleCommandType {
  MODULE_COMMAND_TYPE_UNSPECIFIED = 0;
  MODULE_COMMAND_TYPE_LOAD = 1;
  MODULE_COMMAND_TYPE_UNLOAD = 2;
  MODULE_COMMAND_TYPE_ENABLE = 3;
  MODULE_COMMAND_TYPE_DISABLE = 4;
  MODULE_COMMAND_TYPE_CONFIGURE = 5;
  MODULE_COMMAND_TYPE_QUERY_STATE = 6;
  MODULE_COMMAND_TYPE_RESET = 7;
}

message ModuleEvent {
  string module_id = 1;
  astra.common.v1.ModuleState state = 2;
  string message = 3;
  astra.common.v1.AstraTimestamp timestamp = 4;
  map<string, string> metadata = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// 心跳 & 生命周期
// ─────────────────────────────────────────────────────────────────────────────

message Heartbeat {
  int64 sequence = 1;
  astra.common.v1.AstraTimestamp timestamp = 2;
}

message HeartbeatAck {
  int64 sequence = 1;             // 回显 sequence
  int64 daemon_uptime_seconds = 2;
  int32 active_connections = 3;
}

message ShutdownRequest {
  string reason = 1;
  bool graceful = 2;              // true = 等待进行中操作完成
  int64 grace_period_ms = 3;
}

message ShutdownResponse {
  astra.common.v1.StatusCode status = 1;
  int32 pending_operations = 2;   // 未完成操作数
}

// ─────────────────────────────────────────────────────────────────────────────
// 状态报告
// ─────────────────────────────────────────────────────────────────────────────

message StatusReport {
  astra.common.v1.AstraTimestamp timestamp = 1;
  int64 uptime_seconds = 2;
  int64 memory_rss_bytes = 3;
  int32 active_modules = 4;
  int64 total_policy_evaluations = 5;
  int64 denied_evaluations = 6;
  repeated ModuleStatus module_statuses = 7;
}

message ModuleStatus {
  string module_id = 1;
  astra.common.v1.ModuleState state = 2;
  int64 memory_bytes = 3;
  int64 evaluation_count = 4;
  astra.common.v1.AstraTimestamp last_active = 5;
}

---
