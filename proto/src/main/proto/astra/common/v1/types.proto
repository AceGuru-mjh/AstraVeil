// AstraVeil — 共享基础类型
// 所有模块间通信的基础数据结构定义。

syntax = "proto3";

package astra.common.v1;

option java_package = "com.astraveil.proto.common.v1";
option java_multiple_files = true;
option java_outer_classname = "TypesProto";

// ─────────────────────────────────────────────────────────────────────────────
// 通用枚举
// ─────────────────────────────────────────────────────────────────────────────

// 操作结果状态
enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;
  STATUS_CODE_OK = 1;
  STATUS_CODE_DENIED = 2;
  STATUS_CODE_ERROR = 3;
  STATUS_CODE_TIMEOUT = 4;
  STATUS_CODE_NOT_FOUND = 5;
  STATUS_CODE_ALREADY_EXISTS = 6;
  STATUS_CODE_PERMISSION_DENIED = 7;
  STATUS_CODE_RESOURCE_EXHAUSTED = 8;
}

// 安全等级
enum SecurityLevel {
  SECURITY_LEVEL_UNSPECIFIED = 0;
  SECURITY_LEVEL_STANDARD = 1;    // 标准沙箱
  SECURITY_LEVEL_HARDENED = 2;    // 强化沙箱
  SECURITY_LEVEL_ISOLATED = 3;    // 完全隔离
  SECURITY_LEVEL_TRUSTED = 4;     // 受信任（系统级）
}

// 模块状态
enum ModuleState {
  MODULE_STATE_UNSPECIFIED = 0;
  MODULE_STATE_INACTIVE = 1;
  MODULE_STATE_LOADING = 2;
  MODULE_STATE_ACTIVE = 3;
  MODULE_STATE_SUSPENDED = 4;
  MODULE_STATE_ERROR = 5;
  MODULE_STATE_UNLOADING = 6;
}

// ─────────────────────────────────────────────────────────────────────────────
// 通用消息
// ─────────────────────────────────────────────────────────────────────────────

// 时间戳（避免依赖 google.protobuf.Timestamp 以减少 lite 体积）
message AstraTimestamp {
  int64 seconds = 1;      // Unix epoch 秒
  int32 nanos = 2;        // 纳秒部分 [0, 999999999]
}

// 操作结果
message OperationResult {
  StatusCode code = 1;
  string message = 2;
  map<string, string> metadata = 3;
}

// 进程标识
message ProcessIdentity {
  int32 pid = 1;
  int32 uid = 2;
  string package_name = 3;
  string process_name = 4;
  SecurityLevel security_level = 5;
}

// 权限条目
message PermissionEntry {
  string permission = 1;          // e.g. "android.permission.CAMERA"
  bool granted = 2;
  AstraTimestamp granted_at = 3;
  string granted_by = 4;          // 授权来源模块
}

// 资源配额
message ResourceQuota {
  int64 memory_bytes = 1;         // 最大内存 (bytes)
  int32 cpu_millicores = 2;       // CPU 配额 (1000 = 1 core)
  int64 disk_bytes = 3;           // 磁盘配额 (bytes)
  int32 max_threads = 4;          // 最大线程数
  int32 max_fds = 5;              // 最大文件描述符数
}

---
