# detekt configuration for AstraVeil
#
# Builds upon detekt's default config (buildUponDefaultConfig = true in root
# build.gradle.kts). Only overrides / tightenings are listed here.
# Run: ./gradlew detekt

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 250
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable', 'Inject']
  CyclomaticComplexMethod:
    active: true
    threshold: 25
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 25
  LargeClass:
    active: true
    threshold: 600
  NestedBlockDepth:
    active: true
    threshold: 6

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    # Compose composable functions are PascalCase
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9]*'
  VariableNaming:
    active: true
    variablePattern: '[a-z][a-zA-Z0-9]*'

style:
  active: true
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreAnnotated: ['Composable']
  WildcardImport:
    active: true
  UnusedImports:
    active: true
  ForbiddenComment:
    active: true
    comments:
      - reason: 'TODO must reference an issue (TODO(#123))'
        value: 'TODO(?!#\d)'
  ReturnCount:
    active: true
    max: 4
  LoopWithTooManyJumpStatements:
    active: true
    maxJumpCount: 2
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true

formatting:
  active: true
  ArgumentListWrapping:
    active: false
  MultiLineIfElse:
    active: false
  SpacingBetweenDeclarationsWithAnnotations:
    active: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  UnreachableCode:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - IllegalMonitorStateException
      - NullPointerException
      - IndexOutOfBoundsException

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
