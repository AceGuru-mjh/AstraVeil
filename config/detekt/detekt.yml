# detekt configuration for AstraVeil
#
# Builds upon detekt's default config (buildUponDefaultConfig = true in root
# build.gradle.kts). Only overrides / tightenings are listed here.
# Run: ./gradlew detekt
#
# Note: the formatting ruleset is disabled because the codebase predates
# detekt and has hundreds of formatting deviations. The style rules below
# are relaxed to match the existing code conventions. These can be tightened
# over time as the code is cleaned up.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 250
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable', 'Inject']
  CyclomaticComplexMethod:
    active: true
    threshold: 25
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 25
  LargeClass:
    active: true
    threshold: 600
  NestedBlockDepth:
    active: true
    threshold: 6

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    # Compose composable functions are PascalCase
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9]*'
  VariableNaming:
    active: true
    variablePattern: '[a-z][a-zA-Z0-9]*'

style:
  active: true
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  UnusedImports:
    active: false
  ForbiddenComment:
    active: false
  ReturnCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: true
    maxJumpCount: 2
  MaximumLineLength:
    active: true
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  MayBeConst:
    active: false
  UseCheckOrError:
    active: false
  UnusedParameter:
    active: false
  UnusedPrivateProperty:
    active: false
  FunctionOnlyReturningConstant:
    active: false
  MatchingDeclarationName:
    active: false
  StringTemplate:
    active: false
  MemberNameEqualsClassName:
    active: false
  ConstructorParameterNaming:
    active: false
  SpreadOperator:
    active: false

# The entire formatting ruleset is disabled — the codebase has hundreds of
# formatting deviations (Wrapping, Indentation, NoMultipleSpaces, etc.) that
# predate detekt. These are cosmetic and can be addressed incrementally.
formatting:
  active: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  UnreachableCode:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - IllegalMonitorStateException
      - NullPointerException
      - IndexOutOfBoundsException

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: false
